# acme-nginx nginx common: streaming reverse-proxy defaults
# Deploy to /etc/nginx/snippets/proxy-stream-common.conf
# Include inside a server block or location, then set proxy_pass yourself:
#   location / {
#       include snippets/proxy-stream-common.conf;
#       proxy_pass http://127.0.0.1:8080;
#   }
# Requires proxy-common-map.conf (http context) for $connection_upgrade.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
client_max_body_size 100m;