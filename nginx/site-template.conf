# acme-nginx 站点模板：反代一个本机服务（HTTPS + 流式 / WebSocket 默认值）
#
# 用法：把 <domain> 与 <port> 替换掉，落成 /etc/nginx/<site>.conf，
#       在 nginx.conf 的 http 块内加一条 include，然后 nginx -t && systemctl reload nginx。
#       没替换占位符就使用会导致 nginx -t 直接报错（有意如此，避免静默生效）。
#
# 为什么 map 写在本文件里：map 必须位于 http 上下文，而本文件正是被 nginx.conf 以 include
# 引入 http 块（不能塞进 server/location）。这也是本模板不依赖 conf.d/ 与 snippets/ 的原因 ——
# 适合"只保留必须文件"的最小化服务器。
#
# 本文件内联了 proxy-stream-common.conf 的规则作为默认值（本目录 README.md 有对照说明）：
# 改那份片段时请同步本模板的 location 段，并用 README 的比对命令确认没有漂移。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# HTTP 一律跳转 HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name <domain>;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name <domain>;

    # acme-nginx 签发的证书：稳定路径，续期后自动切换，无需改本文件
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/acme-nginx/fullchain.pem;
    ssl_certificate_key /etc/acme-nginx/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:<port>;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        client_max_body_size    100m;
    }
}
