# acme-nginx 站点块模板：给已有安装**加一个**反代站点
#
# 用法：替换 <domain> / <port>，把下面两组 server 块粘进 nginx.conf 的 http {} 内
#       （缩进与 nginx.conf.template 保持一致），然后 nginx -t && systemctl reload nginx。
#       占位符没替换就使用会导致 nginx -t 报错（有意如此，避免静默生效）。
#
# 前提：http 层已经有一套「反代默认值」与那个 map —— 见 nginx.conf.template。所以这里
#       **不需要**重复写 proxy_set_header / buffering / timeout / client_max_body_size，
#       location 里只写 proxy_pass 即可。若机器上还没有那套默认值，请先用
#       nginx.conf.template 重建主配置，或改用 proxy-stream-common.conf 的片段形式。

# ---- 站点：<name> → 127.0.0.1:<port> ----
server {
    listen      80;
    listen      [::]:80;
    server_name <domain>;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name <domain>;

    # 证书来自 acme-nginx 稳定路径：续期后自动切换，无需改本文件
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/acme-nginx/fullchain.pem;
    ssl_certificate_key /etc/acme-nginx/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:<port>;
    }
}
